[project]
name = "public-api-crawler"
version = "0.1.0"
description = "Discovery crawler for the Public API Discovery Engine"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Option()/typer.Argument() in defaults is the framework's own API.
"src/crawler/cli.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
