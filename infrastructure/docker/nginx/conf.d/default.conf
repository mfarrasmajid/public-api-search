# Single entry point for the whole POC:
#   /api, /up   -> Laravel (php-fpm)
#   everything else -> Vite dev server (React)
#
# One origin means no CORS headaches in the browser during development.

upstream php_backend {
    server backend:9000;
}

upstream vite_frontend {
    server frontend:5173;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 32m;

    charset utf-8;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # --- Laravel ------------------------------------------------------------
    location ~ ^/(api|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120s;
    }

    # --- Frontend (Vite dev server, includes HMR websocket) -----------------
    location / {
        proxy_pass http://vite_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
